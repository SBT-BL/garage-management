<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#405189">
    <title>Offline — Garage Management</title>
    <style>
        :root {
            --app-primary: #405189;
            --app-content-bg: #f3f6f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--app-content-bg);
            color: #212529;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 26rem;
            background: #fff;
            border: 1px solid #e9ebec;
            border-radius: 0.5rem;
            padding: 1.75rem;
            text-align: center;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04);
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.25rem;
            color: var(--app-primary);
        }

        p {
            margin: 0 0 1.25rem;
            color: #6c757d;
            line-height: 1.5;
        }

        button {
            appearance: none;
            border: 0;
            border-radius: 0.375rem;
            background: var(--app-primary);
            color: #fff;
            font: inherit;
            font-weight: 600;
            padding: 0.6rem 1.1rem;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.95);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>Garage Management needs a connection to load live customer, vehicle, and job card data. Reconnect and try again.</p>
        <button type="button" onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
